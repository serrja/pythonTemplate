name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - name: Source quality and Copier regressions
        run: |
          uv sync --locked --python 3.12
          make check
      - name: Coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintenance-coverage
          path: coverage/
          if-no-files-found: error
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: cli, variant: cli, persistence: false}
          - {profile: library, variant: library, persistence: false}
          - {profile: service, variant: service, persistence: false}
          - {profile: service, variant: serviceDb, persistence: true}
          - {profile: native, variant: native, persistence: false}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install 3.12
      - name: Render
        run: uv run --locked copier copy --defaults . "$RUNNER_TEMP/rendered" -d projectName=example${{ matrix.variant }} -d profile=${{ matrix.profile }} -d withPersistence=${{ matrix.persistence }}
      - name: Build generated project
        working-directory: ${{ runner.temp }}/rendered
        run: |
          uv lock
          uv sync --locked --python 3.12
          make check build
      - name: Service import
        if: matrix.profile == 'service'
        working-directory: ${{ runner.temp }}/rendered
        run: uv run --locked python -c 'import importlib; print(importlib.import_module("example${{ matrix.variant }}".lower() + ".app").app.title)'
      - name: Service image
        if: matrix.profile == 'service'
        working-directory: ${{ runner.temp }}/rendered
        run: docker build --file Dockerfile --tag example-service:ci .
  required:
    if: always()
    needs: [source, template]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require completed maintenance and render verification
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          TEMPLATE_RESULT: ${{ needs.template.result }}
        run: test "$SOURCE_RESULT" = success && test "$TEMPLATE_RESULT" = success
