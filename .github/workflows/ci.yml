name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [cli, library, service, native]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install 3.12
      - name: Render
        run: uvx --from 'copier==9.17.2' copier copy --defaults . "$RUNNER_TEMP/rendered" -d projectName=example${{ matrix.profile }} -d profile=${{ matrix.profile }}
      - name: Build generated project
        working-directory: ${{ runner.temp }}/rendered
        run: |
          uv lock
          uv sync --locked --python 3.12
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv build
      - name: Test status
        run: |
          echo 'NOT_CONFIGURED: generated project has no subject tests'
      - name: Service image
        if: matrix.profile == 'service'
        working-directory: ${{ runner.temp }}/rendered
        run: docker build --file Dockerfile --tag example-service:ci .
