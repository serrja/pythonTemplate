name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: cli, variant: cli, persistence: false}
          - {profile: library, variant: library, persistence: false}
          - {profile: service, variant: service, persistence: false}
          - {profile: service, variant: serviceDb, persistence: true}
          - {profile: native, variant: native, persistence: false}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install 3.12
      - name: Render
        run: uvx --from 'copier==9.17.2' copier copy --defaults . "$RUNNER_TEMP/rendered" -d projectName=example${{ matrix.variant }} -d profile=${{ matrix.profile }} -d withPersistence=${{ matrix.persistence }}
      - name: Build generated project
        working-directory: ${{ runner.temp }}/rendered
        run: |
          uv lock
          uv sync --locked --python 3.12
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv build
      - name: Service import
        if: matrix.profile == 'service'
        working-directory: ${{ runner.temp }}/rendered
        run: uv run --locked python -c 'from example${{ matrix.variant }}.app import app; print(app.title)'
      - name: Test status
        run: |
          echo 'NOT_CONFIGURED: generated project has no subject tests'
      - name: Service image
        if: matrix.profile == 'service'
        working-directory: ${{ runner.temp }}/rendered
        run: docker build --file Dockerfile --tag example-service:ci .
