name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install 3.12
      - name: Source quality and Copier regressions
        run: |
          uv run --no-project --python 3.12 --with 'copier==9.17.2' --with 'pytest>=9,<10' --with 'ruff==0.16.4' --with 'mypy>=2.3,<3' ruff check --target-version py312 --select B,E,F,I,N,RUF,UP tools tests
          uv run --no-project --python 3.12 --with 'copier==9.17.2' --with 'pytest>=9,<10' --with 'ruff==0.16.4' --with 'mypy>=2.3,<3' ruff format --target-version py312 --check tools tests
          uv run --no-project --python 3.12 --with 'copier==9.17.2' --with 'pytest>=9,<10' --with 'ruff==0.16.4' --with 'mypy>=2.3,<3' mypy --strict tools/compose_template.py
          uv run --no-project --python 3.12 --with 'copier==9.17.2' --with 'pytest>=9,<10' --with 'ruff==0.16.4' --with 'mypy>=2.3,<3' pytest -q tests
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: cli, variant: cli, persistence: false}
          - {profile: library, variant: library, persistence: false}
          - {profile: service, variant: service, persistence: false}
          - {profile: service, variant: serviceDb, persistence: true}
          - {profile: native, variant: native, persistence: false}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install 3.12
      - name: Render
        run: uvx --from 'copier==9.17.2' copier copy --defaults . "$RUNNER_TEMP/rendered" -d projectName=example${{ matrix.variant }} -d profile=${{ matrix.profile }} -d withPersistence=${{ matrix.persistence }}
      - name: Build generated project
        working-directory: ${{ runner.temp }}/rendered
        run: |
          uv lock
          uv sync --locked --python 3.12
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          if [ "${{ matrix.profile }}" = service ]; then uv run --locked pytest -q; fi
          uv build
      - name: Service import
        if: matrix.profile == 'service'
        working-directory: ${{ runner.temp }}/rendered
        run: uv run --locked python -c 'import importlib; print(importlib.import_module("example${{ matrix.variant }}".lower() + ".app").app.title)'
      - name: Test status for non-service profile
        if: matrix.profile != 'service'
        run: |
          echo 'NOT_APPLICABLE: no runtime behavior is generated for this profile'
      - name: Service image
        if: matrix.profile == 'service'
        working-directory: ${{ runner.temp }}/rendered
        run: docker build --file Dockerfile --tag example-service:ci .
